name: Refresh Personal Newspaper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh.yml"
      - "config.yml"
      - "generate_newspaper.py"
      - "render_stocks.py"
      - "stock_health.py"
      - "requirements.txt"
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:       # manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: refresh-personal-newspaper
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Generate newspaper + stock dashboard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_newspaper.py

      - name: Commit updated newspaper
        run: |
          set -e
          git config user.name "personal-newspaper-bot"
          git config user.email "bot@example.com"
          git add index.html

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Refresh newspaper + stocks $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Retry transient GitHub push failures. The fetch/rebase also handles
          # the unlikely case that another run updated main while this job ran.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after $attempt attempts"
              exit 1
            fi

            echo "Push attempt $attempt failed; syncing and retrying..."
            sleep $((attempt * 5))
            git fetch origin main
            git rebase origin/main
          done
